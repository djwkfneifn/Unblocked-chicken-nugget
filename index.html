
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chicken Nugget Games | Unblocked</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050507;
        color: #fafafa;
        margin: 0;
        overflow-x: hidden;
      }
      
      /* Space Background Effect */
      .space-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(ellipse at bottom, #1b1b2f 0%, #050507 100%);
        overflow: hidden;
      }

      .stars {
        position: absolute;
        top: 0;
        left: 0;
        width: 2px;
        height: 2px;
        background: transparent;
        box-shadow: 1744px 122px #FFF , 134px 1321px #FFF , 92px 859px #FFF , 1521px 451px #FFF , 1211px 121px #FFF , 452px 145px #FFF , 1800px 500px #FFF, 200px 100px #FFF, 800px 1200px #FFF, 1400px 1500px #FFF, 500px 1800px #FFF;
        animation: animStar 150s linear infinite;
      }

      .stars2 {
        width: 1px;
        height: 1px;
        box-shadow: 444px 122px #FFF , 34px 321px #FFF , 192px 159px #FFF , 521px 151px #FFF , 211px 1121px #FFF , 152px 4145px #FFF , 800px 500px #FFF, 1200px 100px #FFF, 1800px 1200px #FFF, 400px 1500px #FFF, 1500px 1800px #FFF;
        animation: animStar 100s linear infinite;
      }

      @keyframes animStar {
        from { transform: translateY(0px); }
        to { transform: translateY(-2000px); }
      }

      .font-mono {
        font-family: 'JetBrains+Mono', monospace;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #09090b;
      }
      ::-webkit-scrollbar-thumb {
        background: #4c1d95;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6d28d9;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>
</head>
  <body>
    <div class="space-bg">
      <div class="stars"></div>
      <div class="stars2"></div>
    </div>
    <div id="root"></div>
  </body>
</html>
